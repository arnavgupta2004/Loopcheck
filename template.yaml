AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  LoopCheck demo backend: API Gateway HTTP API -> Lambda (Python 3.13, OpenCV 5.0.0.93)
  running the deterministic comparison pipeline and the adaptive inspection agent.
  Public, unauthenticated, throttled demo endpoint for temporary judging use.
  No S3 buckets, databases or other stateful resources are created by this template
  (SAM's managed deployment-artifact bucket is created by `sam deploy --resolve-s3`).
  Throttling and reserved concurrency reduce cost risk but do not guarantee a maximum bill.

Parameters:
  AllowedOrigin:
    Type: String
    Default: http://localhost:8501
    AllowedPattern: "^https?://[A-Za-z0-9.-]+(:[0-9]{1,5})?$"
    ConstraintDescription: one exact origin such as https://my-ui.example.com or http://localhost:8501 (no "*", no path)
    Description: >
      Single browser origin allowed by CORS. CORS only restricts which web pages may call the API
      from a browser; it is NOT authentication (curl or a server can call the API regardless).
  MemorySizeMB:
    Type: Number
    Default: 2048
    AllowedValues: [1024, 1536, 2048, 3008]
    Description: Lambda memory (CPU scales with memory).
  ThrottleRatePerSecond:
    Type: Number
    Default: 2
    Description: Steady-state requests per second allowed by the HTTP API (cost guard).
  ThrottleBurst:
    Type: Number
    Default: 5
    Description: Burst requests allowed by the HTTP API (cost guard).
  ReservedConcurrency:
    Type: Number
    Default: 2
    MinValue: 0
    MaxValue: 10
    Description: >
      Caps concurrent executions of the function (default 2). AWS rejects a reservation that would
      leave the account with fewer than 10 unreserved executions; accounts whose total concurrency
      limit is 10 (common for new accounts) must deploy with ReservedConcurrency=0 (no reservation).
      deploy/preflight.sh checks this read-only before deployment.
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30]

Conditions:
  HasReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrency, 0]]

Resources:
  InspectApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: LoopCheck inspection API (public, unauthenticated demo; throttled)
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ThrottleRatePerSecond
        ThrottlingBurstLimit: !Ref ThrottleBurst

  InspectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: LoopCheck OpenCV 5 pipeline + adaptive agent
      # The exact zip built AND import-verified by deploy/build_lambda_zip.sh (no Docker needed).
      # Do not point CodeUri at the unpacked folder: `sam build`'s Python builder excludes *.so,
      # *.dist-info and __pycache__ from source folders, which drops cv2.abi3.so and numpy's C
      # extensions from the pre-vendored dependencies (observed with SAM CLI 1.170.0). With a
      # .zip CodeUri, `sam build` passes the archive through unchanged and `sam deploy` uploads it.
      CodeUri: deploy/.build/loopcheck-lambda-x86_64.zip
      Handler: loopcheck.aws_lambda.handler
      Runtime: python3.13
      Architectures: [x86_64]            # matches the wheels built and import-verified locally
      MemorySize: !Ref MemorySizeMB
      Timeout: 29                         # HTTP API integrations time out at 30 s
      EphemeralStorage:
        Size: 512
      ReservedConcurrentExecutions: !If [HasReservedConcurrency, !Ref ReservedConcurrency, !Ref AWS::NoValue]
      LoggingConfig:
        LogGroup: !Ref InspectLogGroup
      Environment:
        Variables:
          OPENCV_LOG_LEVEL: ERROR
      # Least privilege: no Policies. SAM attaches only AWSLambdaBasicExecutionRole
      # (CloudWatch Logs). The function reads nothing from S3 and holds no secrets.
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref InspectApi
            Method: GET
            Path: /health
            PayloadFormatVersion: "2.0"
        Inspect:
          Type: HttpApi
          Properties:
            ApiId: !Ref InspectApi
            Method: POST
            Path: /inspect
            PayloadFormatVersion: "2.0"
            TimeoutInMillis: 29000

  InspectLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-inspect
      RetentionInDays: !Ref LogRetentionDays

Outputs:
  ApiUrl:
    Description: Base URL for LOOPCHECK_API_URL (GET /health, POST /inspect)
    Value: !Sub https://${InspectApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  FunctionName:
    Value: !Ref InspectFunction
