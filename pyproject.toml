[project]
name = "loopcheck"
version = "0.0.1"
description = "Agentic visual inspection: reference-vs-inspection comparison with OpenCV 5"
requires-python = ">=3.11"
dependencies = [
    # Pinned: competition requires OpenCV 5. Do not install any other opencv-* package
    # alongside this one; they all provide the same `cv2` module and overwrite each other.
    "opencv-contrib-python-headless==5.0.0.93",
    "numpy>=2.0",
]

[tool.uv]
package = false
